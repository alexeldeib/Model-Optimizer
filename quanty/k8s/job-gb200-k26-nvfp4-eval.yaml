---
# K2.6 NVFP4 quality gate for a completed PTQ export on k26-nvfp4-ckpt.
#
# This intentionally tracks the known-good serving stack from
# c2-k26-nvfp4-abl-s29cf-bw9d5: vLLM v2.9.0, FLASHINFER_MLA attention,
# TP=4 on one GB200 node, max_model_len=262144, block_size=32.  Set
# MODEL_LABEL/MODEL_PATH before applying for a unique PTQ output, then
# compare against the BF16 baseline with a 1% absolute regression threshold.
apiVersion: batch/v1
kind: Job
metadata:
  name: quanty-gb200-k26-nvfp4-eval
  namespace: ace-inference
  labels:
    app: quanty-gb200-k26-nvfp4-eval
    workstream: k26-nvfp4-quality-eval
    owner: aeldeib
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: quanty-gb200-k26-nvfp4-eval
        owner: aeldeib
    spec:
      restartPolicy: Never
      schedulerName: binpack-scheduler
      priorityClassName: inference-partial-node
      imagePullSecrets:
        - name: inference-backends-image-pull-secret
        - name: cloudsmith-pull-secret
      nodeSelector:
        node.coreweave.cloud/type: gb200-4x-l
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: ckpt
          persistentVolumeClaim:
            claimName: k26-nvfp4-ckpt
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 128Gi
      containers:
        - name: harness
          image: docker.cloudsmith.io/coreweave/infr/vllm:v2.9.0
          imagePullPolicy: IfNotPresent
          workingDir: /work
          env:
            - name: HF_HOME
              value: /work/hf-cache
            - name: TRANSFORMERS_CACHE
              value: /work/hf-cache
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: k26-hf-secret
                  key: HF_TOKEN
                  optional: true
            - name: NCCL_DEBUG
              value: "WARN"
            - name: NCCL_CUMEM_ENABLE
              value: "1"
            - name: NCCL_NVLS_ENABLE
              value: "1"
            - name: NCCL_SOCKET_IFNAME
              value: eth0
            - name: VLLM_ATTENTION_BACKEND
              value: FLASHINFER_MLA
            - name: VLLM_USE_FLASHINFER_MOE_FP4
              value: "1"
            - name: VLLM_FLASHINFER_MOE_BACKEND
              value: throughput
            - name: MODEL_LABEL
              value: REPLACE_WITH_RUN_ID
            - name: MODEL_PATH
              value: /work/quanty/exports/REPLACE_WITH_RUN_ID
            - name: EVAL_TASKS
              value: gsm8k,arc_challenge,hellaswag,mmlu
            - name: EVAL_LIMIT
              value: "0"
            - name: EVAL_BATCH_SIZE
              value: auto
            - name: MAX_MODEL_LEN
              value: "262144"
            - name: BLOCK_SIZE
              value: "32"
            - name: REGRESSION_THRESHOLD
              value: "0.01"
          resources:
            limits:
              nvidia.com/gpu: 4
              memory: 700Gi
              cpu: 64
            requests:
              nvidia.com/gpu: 4
              memory: 600Gi
              cpu: 48
          volumeMounts:
            - name: ckpt
              mountPath: /work
            - name: shm
              mountPath: /dev/shm
          command:
            - bash
            - -lc
            - |
              set -euo pipefail

              if [[ "${MODEL_LABEL}" == REPLACE_WITH* || "${MODEL_PATH}" == *REPLACE_WITH* ]]; then
                  echo "Set MODEL_LABEL and MODEL_PATH to a completed export before launching" >&2
                  exit 64
              fi

              if ! python -c "import lm_eval, ray" >/dev/null 2>&1; then
                  # Do not install the lm-eval vllm extra here: this image
                  # carries the custom vLLM stack under validation, and the
                  # extra can pull/replace vLLM from PyPI.
                  pip install --quiet "lm-eval>=0.4.5" "ray>=2.40,<3"
              fi

              if [ ! -d "${MODEL_PATH}" ]; then
                  echo "MODEL_PATH does not exist: ${MODEL_PATH}" >&2
                  exit 1
              fi

              OUT_DIR="${MODEL_PATH}/eval-results-vllm29"
              SUMMARY="${MODEL_PATH}/eval-summary-vllm29.json"
              mkdir -p "${OUT_DIR}"

              if [ "${EVAL_LIMIT}" = "0" ] || [ -z "${EVAL_LIMIT}" ]; then
                  LIMIT_ARG=""
              else
                  LIMIT_ARG="--limit ${EVAL_LIMIT}"
              fi

              VLLM_BASE_ARGS="tensor_parallel_size=4,gpu_memory_utilization=0.95,max_model_len=${MAX_MODEL_LEN},block_size=${BLOCK_SIZE},max_num_batched_tokens=8192,max_num_seqs=50,trust_remote_code=True,enforce_eager=False"

              rm -rf "${OUT_DIR:?}"/*
              lm_eval \
                  --model vllm \
                  --model_args "pretrained=${MODEL_PATH},${VLLM_BASE_ARGS}" \
                  --tasks "${EVAL_TASKS}" \
                  --batch_size "${EVAL_BATCH_SIZE}" \
                  --apply_chat_template \
                  --fewshot_as_multiturn \
                  ${LIMIT_ARG} \
                  --output_path "${OUT_DIR}" \
                  --log_samples \
                  2>&1 | tee "${OUT_DIR}/run.log"

              python <<'PY' | tee "${SUMMARY}"
              import glob, importlib.metadata as md, json, os, sys

              label = os.environ["MODEL_LABEL"]
              out_dir = os.path.join(os.environ["MODEL_PATH"], "eval-results-vllm29")
              threshold = float(os.environ.get("REGRESSION_THRESHOLD", "0.01"))
              baseline = {
                  "arc_challenge": {"metric": "acc,none", "score": 0.6758},
                  "gsm8k": {"metric": "exact_match,strict-match", "score": 0.9416},
                  "hellaswag": {"metric": "acc,none", "score": 0.7749},
                  "mmlu": {"metric": "acc,none", "score": 0.8908},
              }

              paths = sorted(glob.glob(f"{out_dir}/**/results_*.json", recursive=True))
              if not paths:
                  print(json.dumps({"error": f"no results json under {out_dir}"}, indent=2))
                  sys.exit(1)
              with open(paths[-1]) as f:
                  results = json.load(f)["results"]

              report = {
                  "model": label,
                  "source": paths[-1],
                  "threshold": threshold,
                  "baseline": baseline,
                  "versions": {},
                  "tasks": {},
                  "regressions": [],
                  "missing_metrics": [],
              }
              for package in ("lm-eval", "lm_eval", "vllm", "transformers"):
                  try:
                      report["versions"][package] = md.version(package)
                  except md.PackageNotFoundError:
                      pass

              for task, base in baseline.items():
                  metrics = results.get(task)
                  key = base["metric"]
                  if metrics is None or key not in metrics:
                      report["missing_metrics"].append(
                          {
                              "task": task,
                              "metric": key,
                              "available_metrics": sorted(metrics or {}),
                          }
                      )
                      continue
                  name, suffix = key.split(",", 1)
                  stderr = metrics.get(f"{name}_stderr,{suffix}", 0.0)
                  score = float(metrics[key])
                  delta = score - base["score"]
                  entry = {
                      "metric": key,
                      "score": score,
                      "stderr": float(stderr),
                      "score_pct": score * 100.0,
                      "baseline_score": base["score"],
                      "delta": delta,
                      "delta_pct": delta * 100.0,
                      "regressed": delta < -threshold,
                  }
                  report["tasks"][task] = entry
                  if entry["regressed"]:
                      report["regressions"].append({"task": task, **entry})

              print(json.dumps(report, indent=2))
              if report["missing_metrics"] or report["regressions"]:
                  sys.exit(1)
              PY
