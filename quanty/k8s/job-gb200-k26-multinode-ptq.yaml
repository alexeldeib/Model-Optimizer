---
# K2.6 NVFP4 multinode PTQ on 6x GB200 nodes (24 GPUs, ~4.4 TB HBM total).
#
# 4-node attempt (2026-04-27) confirmed OOM at 181/184 GiB during
# _process_quantized_modules even with the per-expert input_scale fix
# in commit 543273c2b (the fix targets quality, not memory).  Diagnostic
# prints from commit 4ca081b9f showed entry at allocated=125.8 GiB peak=
# 166.0 GiB -- 55 GiB headroom for the conversion + state_dict gather
# segment that needs ~55 GiB.  Doesn't fit at 4-node.
#
# 6-node halves per-rank shard from 130 -> 87 GiB, frees ~43 GiB peak,
# brings the export segment well under the ceiling.
#
# Topology:
#   * Indexed Job, parallelism=completions=6 -> pods 0..5
#   * Each pod gets 4x GB200 GPUs (24 GPUs total)
#   * Pod-0 is torchrun rendezvous master, reachable via the headless
#     service DNS as quanty-gb200-k26-mn-ptq-0.<svc>:29500
#   * Layerwise checkpoint dir on shared PVC means a preempted pod
#     resumes from the last fully-written layer without redoing the
#     ~2 hours of GPTQ Hessian collection per layer.
#
# Headless service must allow not-ready addresses so workers can
# resolve the master before any pod transitions to Ready.
apiVersion: v1
kind: Service
metadata:
  name: quanty-gb200-k26-mn-rdzv
  namespace: ace-inference
  labels:
    app: quanty-gb200-k26-mn-ptq
    workstream: phase3-k26-ptq-multinode
    owner: aeldeib
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: quanty-gb200-k26-mn-ptq
  ports:
    - name: rdzv
      port: 29500
      targetPort: 29500
      protocol: TCP
---
apiVersion: batch/v1
kind: Job
metadata:
  name: quanty-gb200-k26-mn-ptq
  namespace: ace-inference
  labels:
    app: quanty-gb200-k26-mn-ptq
    workstream: phase3-k26-ptq-multinode
    owner: aeldeib
spec:
  # Indexed completions assign each pod a unique JOB_COMPLETION_INDEX
  # (0..parallelism-1).  k8s 1.27+ also auto-sets hostname to
  # <job-name>-<index>, so workers reach pod-0 via DNS without an
  # init-container peek.
  parallelism: 6
  completions: 6
  completionMode: Indexed
  # 8 = ~2 retries per pod.  The layerwise checkpoint resume picks up
  # from the last fully-written layer so a single-node failure costs
  # only the in-flight layer's GPTQ work.
  backoffLimit: 8
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: quanty-gb200-k26-mn-ptq
        owner: aeldeib
    spec:
      restartPolicy: OnFailure
      schedulerName: binpack-scheduler
      priorityClassName: inference-partial-node
      # Subdomain wires pod hostnames into the headless service DNS:
      # quanty-gb200-k26-mn-ptq-<index>.quanty-gb200-k26-mn-rdzv.<ns>.svc...
      subdomain: quanty-gb200-k26-mn-rdzv
      imagePullSecrets:
        - name: inference-backends-image-pull-secret
      nodeSelector:
        node.coreweave.cloud/type: gb200-4x-l
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: bf16-source
          persistentVolumeClaim:
            claimName: k26-source-bf16
            readOnly: true
        - name: nvfp4-ckpt
          persistentVolumeClaim:
            claimName: k26-nvfp4-ckpt
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Gi
        # Runtime overlay of commit 6d25cbe635 (FSDP-aware
        # set_expert_quantizer_amax: reads weights inside an
        # fsdp2_aware_weight_update context so per-expert weight
        # max-abs is meaningful, not the per-rank shard max).
        # Avoids docker rebuild for the patched code; once we
        # validate quality, bake into :dev.
        - name: modelopt-patch
          configMap:
            name: modelopt-fsdp-fix-6d25cbe
      containers:
        - name: ptq
          image: docker.cloudsmith.io/coreweave/infr-dev/quanty-modelopt:dev
          imagePullPolicy: Always
          workingDir: /work
          env:
            - name: NCCL_DEBUG
              value: "WARN"
            # K2.6 export hit OOM at 181/184 GiB with 28 MiB asks
            # because of fragmentation -- modelopt's per-quantized-
            # linear unshard/reshard cycles leave the cuda allocator
            # with many small free blocks but no contiguous space.
            # ``expandable_segments:True`` (the error message itself
            # recommends this) lets the allocator coalesce free space
            # via VMM-style segment growth instead of failing on
            # contiguity.  Negligible runtime overhead.
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: NCCL_ASYNC_ERROR_HANDLING
              value: "1"
            - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
              value: "1"
            # Inter-node NCCL needs to bind to the right interface --
            # eth0 is the cluster-routable iface on these nodes per the
            # c2-k25 deployments' precedent.
            - name: NCCL_SOCKET_IFNAME
              value: "eth0"
            # IB / NVLS opportunistic enables; harmless if unavailable.
            - name: NCCL_NVLS_ENABLE
              value: "1"
            - name: NCCL_IB_DISABLE
              value: "0"
            - name: HF_HOME
              value: /work/hf-cache
            - name: TRANSFORMERS_CACHE
              value: /work/hf-cache
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: k26-hf-secret
                  key: HF_TOKEN
                  optional: true
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # ---- multinode topology ----
            - name: NUM_GPUS
              value: "4"
            - name: NNODES
              value: "6"
            - name: MASTER_ADDR
              value: "quanty-gb200-k26-mn-ptq-0.quanty-gb200-k26-mn-rdzv.ace-inference.svc.cluster.local"
            - name: MASTER_PORT
              value: "29500"
            # k8s injects JOB_COMPLETION_INDEX automatically for
            # Indexed Jobs; the launcher reads it as the node rank.
            # ---- ptq config ----
            - name: TARGET_MODEL
              value: /source/k26-bf16/Kimi-K2.6-BF16
            - name: RECIPE
              value: /opt/quanty/quanty/recipes/k26-nvfp4_experts_only-fp8_kv.yaml
            - name: CHECKPOINT_DIR
              value: /work/quanty/checkpoints/k26-nvfp4-mn
            - name: EXPORT_DIR
              value: /work/quanty/exports/k26-nvfp4-mn
            - name: CALIB_DATASET
              value: nemotron-post-training-dataset-v2
            # With moe_calib_experts_ratio=1.0 enabled in the recipe,
            # calibration forwards every token through ALL 384 experts
            # (top_k=384 instead of deployment's top_k=8).  The output
            # concatenation in DeepseekV3MoE.moe_infer scales linearly with
            # top_k, so cat(outputs, ...) at BATCH=8 SEQ_LEN=2048 needs
            # 8 * 2048 * 384 * 7168 * 2 bytes = 88 GiB on top of the
            # 168 GiB resident model state -- OOMs at 21 GiB allocation
            # request.
            #
            # Cut BATCH to 1 to bring the cat tensor down to ~11 GiB
            # (8x reduction from BATCH=8); SAMPLES from 2048 to 512
            # because every-token-to-every-expert calibration already
            # gives 4x more per-expert coverage than top_k=8 SAMPLES=2048
            # (each expert sees 512 * 2048 = 1M tokens instead of
            # 2048 * 2048 * 8 / 384 = 87k tokens), so reducing samples
            # doesn't lose statistical power.
            - name: CALIB_SAMPLES
              value: "512"
            - name: CALIB_BATCH
              value: "1"
            - name: CALIB_SEQ_LEN
              value: "2048"
            # ---- S3 upload of final export ----
            # ``quanty-s3-creds`` carries the same CW object-store
            # credentials the user has in ~/.aws (created via
            # ``kubectl create secret generic quanty-s3-creds
            # --from-literal=AWS_ACCESS_KEY_ID=... ...``).  Endpoint
            # is the in-cluster URL ``http://cwlota.com``; from a
            # laptop you'd use ``https://cwobject.com``.  Rank-0 of
            # the launcher uploads ${EXPORT_DIR} to ${S3_DEST_PREFIX}
            # after a successful torchrun.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: quanty-s3-creds
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: quanty-s3-creds
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: quanty-s3-creds
                  key: AWS_REGION
            - name: AWS_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: quanty-s3-creds
                  key: AWS_ENDPOINT_URL
            - name: S3_DEST_PREFIX
              value: "s3://infr/test/ace/quants/k26-nvfp4-experts-only"
          resources:
            limits:
              nvidia.com/gpu: 4
              memory: 700Gi
              cpu: 64
            requests:
              nvidia.com/gpu: 4
              memory: 600Gi
              cpu: 48
          ports:
            - name: rdzv
              containerPort: 29500
              protocol: TCP
          volumeMounts:
            - name: bf16-source
              mountPath: /source/k26-bf16
              readOnly: true
            - name: nvfp4-ckpt
              mountPath: /work
            - name: shm
              mountPath: /dev/shm
            # Overlay the two patched modelopt source files via subPath
            # so the rest of the modelopt package on the image is left
            # alone.  K8s reads both at pod creation; if the ConfigMap
            # changes mid-run, kubelet does NOT propagate the update --
            # which is what we want here (avoids stale-during-export).
            - name: modelopt-patch
              mountPath: /opt/quanty/modelopt/torch/export/layer_utils.py
              subPath: layer_utils.py
              readOnly: true
            - name: modelopt-patch
              mountPath: /opt/quanty/modelopt/torch/export/unified_export_hf.py
              subPath: unified_export_hf.py
              readOnly: true
          command:
            - /usr/bin/tini
            - --
            - /opt/quanty/quanty/scripts/run-k26-ptq-multinode.sh
