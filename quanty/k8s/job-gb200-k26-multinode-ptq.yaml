---
# K2.6 NVFP4 multinode PTQ on 5x GB200 nodes (20 GPUs, ~3.7 TB HBM total).
#
# 4-node attempt (2026-04-27) with the stale broad MLP recipe confirmed OOM at 181/184 GiB during
# _process_quantized_modules even with the per-expert input_scale fix
# in commit 543273c2b (the fix targets quality, not memory).  Diagnostic
# prints from commit 4ca081b9f showed entry at allocated=125.8 GiB peak=
# 166.0 GiB -- 55 GiB headroom for the conversion + state_dict gather
# segment that needs ~55 GiB.  Doesn't fit at 4-node.
#
# 5-node keeps the export/conversion segment below the per-rank ceiling while
# avoiding the extra GB200 node. Use 6 nodes when available for more headroom.
#
# Topology:
#   * Indexed Job, parallelism=completions=5 -> pods 0..4
#   * Each pod gets 4x GB200 GPUs (20 GPUs total)
#   * Pod-0 is torchrun rendezvous master, reachable via the headless
#     service DNS as quanty-gb200-k26-mn-ptq-0.<svc>:29500
#   * CHECKPOINT_DIR is still a shared run workspace for scratch files and
#     diagnostics, but this K2.6 recipe intentionally does not write layerwise
#     activation checkpoints because they exceed the current PVC budget.
#
# Headless service must allow not-ready addresses so workers can
# resolve the master before any pod transitions to Ready.
apiVersion: v1
kind: Service
metadata:
  name: quanty-gb200-k26-mn-rdzv
  namespace: ace-inference
  labels:
    app: quanty-gb200-k26-mn-ptq
    workstream: phase3-k26-ptq-multinode
    owner: aeldeib
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: quanty-gb200-k26-mn-ptq
  ports:
    - name: rdzv
      port: 29500
      targetPort: 29500
      protocol: TCP
---
apiVersion: batch/v1
kind: Job
metadata:
  name: quanty-gb200-k26-mn-ptq
  namespace: ace-inference
  labels:
    app: quanty-gb200-k26-mn-ptq
    workstream: phase3-k26-ptq-multinode
    owner: aeldeib
spec:
  # Indexed completions assign each pod a unique JOB_COMPLETION_INDEX
  # (0..parallelism-1).  k8s 1.27+ also auto-sets hostname to
  # <job-name>-<index>, so workers reach pod-0 via DNS without an
  # init-container peek.
  parallelism: 5
  completions: 5
  completionMode: Indexed
  # This recipe intentionally omits layerwise checkpointing for K2.6
  # because the captured activations exceed the PVC budget.  Do not
  # blindly restart failed containers in-place; preserve the failed pod
  # logs so NCCL/collective failures can be diagnosed.
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: quanty-gb200-k26-mn-ptq
        owner: aeldeib
    spec:
      restartPolicy: Never
      schedulerName: binpack-scheduler
      priorityClassName: inference-partial-node
      # Subdomain wires pod hostnames into the headless service DNS:
      # quanty-gb200-k26-mn-ptq-<index>.quanty-gb200-k26-mn-rdzv.<ns>.svc...
      subdomain: quanty-gb200-k26-mn-rdzv
      imagePullSecrets:
        - name: inference-backends-image-pull-secret
      nodeSelector:
        node.coreweave.cloud/type: gb200-4x-l
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: bf16-source
          persistentVolumeClaim:
            claimName: k26-source-bf16
            readOnly: true
        - name: nvfp4-ckpt
          persistentVolumeClaim:
            claimName: k26-nvfp4-ckpt
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Gi
        # Runtime overlay of the current K2.6 ModelOpt patch set:
        # sharded FSDP2 load/export, collective-safe amax sync, DeepSeekV3
        # MoE export detection, and Kimi gate compatibility.
        # Avoids docker rebuild for the patched code; once validated, bake into :dev.
        - name: modelopt-patch
          configMap:
            name: modelopt-k26-minimal-fixes
        # Runtime overlay of the current K2.6 recipe candidate. The docker
        # :dev tag can lag local recipe commits; mounting this file
        # guarantees the job uses the K2.6 production MLP-only recipe.
        - name: k26-recipe
          configMap:
            name: quanty-k26-nvfp4-mlponly-recipe
        - name: ptq-scripts
          configMap:
            name: quanty-k26-ptq-scripts
            # Must contain run-k26-ptq-multinode.sh, patch-k26-modeling.sh,
            # and inspect-nvfp4-export.py. Rank 0 fails closed if the export
            # inspector is missing before S3 upload.
            defaultMode: 0555
      containers:
        - name: ptq
          image: docker.cloudsmith.io/coreweave/infr-dev/quanty-modelopt:dev
          imagePullPolicy: Always
          workingDir: /work
          env:
            - name: NCCL_DEBUG
              value: "WARN"
            # K2.6 export hit OOM at 181/184 GiB with 28 MiB asks
            # because of fragmentation -- modelopt's per-quantized-
            # linear unshard/reshard cycles leave the cuda allocator
            # with many small free blocks but no contiguous space.
            # ``expandable_segments:True`` (the error message itself
            # recommends this) lets the allocator coalesce free space
            # via VMM-style segment growth instead of failing on
            # contiguity.  Negligible runtime overhead.
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: NCCL_ASYNC_ERROR_HANDLING
              value: "1"
            - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
              value: "1"
            - name: TORCH_NCCL_TRACE_BUFFER_SIZE
              value: "1048576"
            - name: TORCH_NCCL_DUMP_ON_TIMEOUT
              value: "1"
            - name: TORCH_NCCL_DESYNC_DEBUG
              value: "1"
            # Inter-node NCCL needs to bind to the right interface --
            # eth0 is the cluster-routable iface on these nodes per the
            # c2-k25 deployments' precedent.
            - name: NCCL_SOCKET_IFNAME
              value: "eth0"
            # IB / NVLS opportunistic enables; harmless if unavailable.
            - name: NCCL_NVLS_ENABLE
              value: "1"
            - name: NCCL_IB_DISABLE
              value: "0"
            - name: HF_HOME
              value: /work/hf-cache
            - name: TRANSFORMERS_CACHE
              value: /work/hf-cache
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: k26-hf-secret
                  key: HF_TOKEN
                  optional: true
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # ---- multinode topology ----
            - name: NUM_GPUS
              value: "4"
            - name: NNODES
              value: "5"
            - name: MASTER_ADDR
              value: "quanty-gb200-k26-mn-ptq-0.quanty-gb200-k26-mn-rdzv.ace-inference.svc.cluster.local"
            - name: MASTER_PORT
              value: "29500"
            # k8s injects JOB_COMPLETION_INDEX automatically for
            # Indexed Jobs; the launcher reads it as the node rank.
            # ---- ptq config ----
            - name: TARGET_MODEL
              value: /source/k26-bf16/Kimi-K2.6-BF16
            - name: QFORMAT
              value: nvfp4_mlp_only
            - name: RECIPE
              value: /opt/quanty/quanty/recipes/k26-nvfp4_mlp_only-fp8_kv.yaml
            # Replace this value at launch time, e.g.
            # k26-nvfp4-mlponly-mn5-$(date -u +%Y%m%dT%H%M%SZ).
            # The launcher derives CHECKPOINT_DIR, EXPORT_DIR, and
            # S3_DEST_PREFIX from RUN_ID when those envs are not set.
            - name: RUN_ID
              value: REPLACE_WITH_UNIQUE_RUN_ID
            - name: CALIB_DATASET
              # Match the ModelOpt examples and avoid
              # introducing a second dataset variable while we isolate
              # recipe/export correctness.
              value: cnn_dailymail
            # Match the single-node dequant verifier while isolating
            # FSDP/multinode correctness. Full MoE coverage comes from
            # moe_calib_experts_ratio=1.0 plus the per-expert token budget
            # below, not from natural top-k routing breadth.
            - name: CALIB_SAMPLES
              value: "512"
            - name: CALIB_BATCH
              value: "1"
            - name: CALIB_SEQ_LEN
              value: "512"
            - name: KV_CACHE_QFORMAT
              value: fp8
            - name: REQUIRE_MOE_COVERAGE
              value: "1"
            - name: MODELOPT_MOE_CALIB_TOKENS_PER_EXPERT
              value: "64"
            - name: MODELOPT_MOE_CALIB_TOKEN_CHUNK
              value: "2048"
            # ---- S3 upload of final export ----
            # ``quanty-s3-creds`` carries the same CW object-store
            # credentials the user has in ~/.aws (created via
            # ``kubectl create secret generic quanty-s3-creds
            # --from-literal=AWS_ACCESS_KEY_ID=... ...``).  Endpoint
            # is the in-cluster URL ``http://cwlota.com``; from a
            # laptop you'd use ``https://cwobject.com``.  Rank-0 of
            # the launcher uploads ${EXPORT_DIR} to ${S3_DEST_PREFIX}
            # after a successful torchrun.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: quanty-s3-creds
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: quanty-s3-creds
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: quanty-s3-creds
                  key: AWS_REGION
            - name: AWS_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: quanty-s3-creds
                  key: AWS_ENDPOINT_URL
          resources:
            limits:
              nvidia.com/gpu: 4
              memory: 900Gi
              cpu: 64
            requests:
              nvidia.com/gpu: 4
              memory: 800Gi
              cpu: 48
          ports:
            - name: rdzv
              containerPort: 29500
              protocol: TCP
          volumeMounts:
            - name: bf16-source
              mountPath: /source/k26-bf16
              readOnly: true
            - name: nvfp4-ckpt
              mountPath: /work
            - name: shm
              mountPath: /dev/shm
            # Overlay the patched modelopt source files via subPath
            # so the rest of the modelopt package on the image is left
            # alone.  K8s reads them at pod creation; if the ConfigMap
            # changes mid-run, kubelet does NOT propagate the update --
            # which is what we want here (avoids stale-during-export).
            - name: modelopt-patch
              mountPath: /opt/quanty/modelopt/torch/quantization/model_calib.py
              subPath: model_calib.py
              readOnly: true
            - name: modelopt-patch
              mountPath: /opt/quanty/modelopt/torch/export/layer_utils.py
              subPath: layer_utils.py
              readOnly: true
            - name: modelopt-patch
              mountPath: /opt/quanty/modelopt/torch/export/unified_export_hf.py
              subPath: unified_export_hf.py
              readOnly: true
            - name: modelopt-patch
              mountPath: /opt/quanty/modelopt/torch/export/quant_utils.py
              subPath: quant_utils.py
              readOnly: true
            - name: modelopt-patch
              mountPath: /opt/quanty/modelopt/torch/quantization/plugins/huggingface.py
              subPath: huggingface.py
              readOnly: true
            - name: modelopt-patch
              mountPath: /opt/quanty/modelopt/torch/quantization/nn/modules/tensor_quantizer.py
              subPath: tensor_quantizer.py
              readOnly: true
            - name: modelopt-patch
              mountPath: /opt/quanty/modelopt/torch/quantization/qtensor/nvfp4_tensor.py
              subPath: nvfp4_tensor.py
              readOnly: true
            - name: modelopt-patch
              mountPath: /opt/quanty/modelopt/torch/quantization/utils/core_utils.py
              subPath: core_utils.py
              readOnly: true
            - name: modelopt-patch
              mountPath: /opt/quanty/modelopt/torch/quantization/utils/layerwise_calib.py
              subPath: layerwise_calib.py
              readOnly: true
            - name: modelopt-patch
              mountPath: /opt/quanty/examples/llm_ptq/multinode_ptq.py
              subPath: multinode_ptq.py
              readOnly: true
            - name: k26-recipe
              mountPath: /opt/quanty/quanty/recipes/k26-nvfp4_mlp_only-fp8_kv.yaml
              subPath: k26-nvfp4_mlp_only-fp8_kv.yaml
              readOnly: true
            - name: ptq-scripts
              mountPath: /opt/quanty/quanty/scripts/run-k26-ptq-multinode.sh
              subPath: run-k26-ptq-multinode.sh
              readOnly: true
            - name: ptq-scripts
              mountPath: /opt/quanty/quanty/scripts/patch-k26-modeling.sh
              subPath: patch-k26-modeling.sh
              readOnly: true
            - name: ptq-scripts
              mountPath: /opt/quanty/quanty/scripts/inspect-nvfp4-export.py
              subPath: inspect-nvfp4-export.py
              readOnly: true
          command:
            - /usr/bin/tini
            - --
            - /opt/quanty/quanty/scripts/run-k26-ptq-multinode.sh
