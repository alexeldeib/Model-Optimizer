# K2.6 NVFP4 recipe aligned with the production vLLM ModelOpt FP4 layout.
#
# The coherent baseline at s3://cwstudio/quantize/kimi-k26-nvfp4/ uses the
# upstream nvfp4_mlp_only shape: routed experts, shared experts, and layer-0
# dense MLP are NVFP4; attention, lm_head, routers, projector, and vision stay
# native.  A routed-expert-only K2.6 export loaded in vLLM but collapsed to a
# repeated-token loop on eval, so keep the production recipe on mlp_only.
metadata:
  recipe_type: ptq
  description: >
    Kimi K2.6 NVFP4 MLP-only W4A4 + FP8 KV cache; self-attention,
    lm_head, projector, vision, routers, and embeddings remain native.

quantize:
  algorithm:
    method: max
    layerwise: true
    # K2.6 natural top_k=8 routing does not activate every routed expert during
    # calibration.  Force full expert coverage in the calibration-only pass,
    # then run the normal router path for model outputs.
    moe_calib_experts_ratio: 1.0
  quant_cfg:
    - quantizer_name: '*'
      enable: false

    - quantizer_name: '*mlp*weight_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1
    - quantizer_name: '*mlp*input_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1

    - quantizer_name: '*block_sparse_moe*weight_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1
    - quantizer_name: '*block_sparse_moe*input_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1

    - quantizer_name: '*self_attn*'
      enable: false
    - quantizer_name: '*vision*'
      enable: false
    - quantizer_name: '*vision_tower*'
      enable: false
    - quantizer_name: '*vit*'
      enable: false
    - quantizer_name: '*moon_vit*'
      enable: false
    - quantizer_name: '*block_sparse_moe.gate*'
      enable: false
    - quantizer_name: '*linear_attn.conv1d*'
      enable: false
    - quantizer_name: '*lm_head*'
      enable: false
    - quantizer_name: '*mixer.conv1d*'
      enable: false
    - quantizer_name: '*mlp.gate.*'
      enable: false
    - quantizer_name: '*mlp.shared_expert_gate.*'
      enable: false
    - quantizer_name: '*output_layer*'
      enable: false
    - quantizer_name: '*proj_out.*'
      enable: false
    - quantizer_name: '*router*'
      enable: false
    - quantizer_name: 'output.*'
      enable: false

    # Keep this after the broad self-attention exclusion. K2.6 production
    # serving wants native attention weights but FP8 KV-cache metadata.
    - quantizer_name: '*[kv]_bmm_quantizer'
      enable: true
      cfg:
        num_bits: e4m3
    - parent_class: 'nn.BatchNorm1d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.BatchNorm2d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.BatchNorm3d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.LeakyReLU'
      quantizer_name: '*'
      enable: false
