# K2.6-aware NVFP4 experts-only + FP8 KV recipe.
#
# Architecture facts that drive the selectors:
#   * K2.6 = KimiK25ForConditionalGeneration wrapping DeepseekV3ForCausalLM
#     (text backbone) + MoonViT (vision encoder).
#   * 61 layers, hidden 7168, 384 routed experts + 1 shared, top_k=8.
#   * MLA attention: q_lora_rank=1536, kv_lora_rank=512.  Up-proj is sensitive
#     to quantization (recovers low-rank latent into full QKV); keep it BF16.
#   * first_k_dense_replace=1 -> layer 0 is dense MLP, layers 1-60 use MoE.
#
# Why this differs from the upstream nvfp4_experts_only-fp8_kv recipe:
#   * Adds DeepSeek-style MoE expert path selectors
#     (`*mlp.experts.*`, `*shared_experts.*`).
#   * Explicitly skips the shared expert (always-active; quant noise compounds).
#   * Skips MLA up-proj quantizers (`*kv_a_proj_with_mqa*`, `*kv_b_proj*`,
#     `*q_a_proj*`, `*q_b_proj*`) -- low-rank to full QKV is precision-sensitive.
#   * Skips the entire MoonViT vision encoder (`*vision*`, `*vit*`) -- visual
#     features mismatched against the LLM token stream when quantized.
#   * Skips the gate/router (`*mlp.gate*`) -- routing decisions need precision.
#   * GPTQ + layerwise calibration with checkpoint resume.
#
# Inherits the layerwise=true mechanism from
# modelopt/torch/quantization/utils/layerwise_calib.py via the
# `algorithm.layerwise: true` toggle.
metadata:
  recipe_type: ptq
  description: >
    Kimi K2.6 NVFP4 experts-only (W4A4) + FP8 KV; MLA up-proj kept BF16,
    shared expert kept BF16, MoonViT kept BF16; GPTQ layerwise calibration
    with shared-FS checkpoint resume.

quantize:
  algorithm:
    # Switched from gptq -> max for K2.6 multinode validation.  GPTQ's
    # multi-replay Hessian collection re-triggers the transformers 5.x
    # DynamicCache cache-replay shape mismatch we first hit on Qwen2.5
    # in Phase 0 (now fixed via cache-strip in modelopt's
    # layerwise_calib.py).  Max is faster and good enough for the
    # first end-to-end validation; GPTQ stays as a follow-up.
    #
    # ``layerwise_checkpoint_dir`` intentionally omitted: each K2.6
    # layer's input activations + cached state is ~30 GiB; 61 layers
    # = ~1.8 TiB which exceeds the 1.5 TiB k26-nvfp4-ckpt PVC.  No
    # resume capability for now -- calibration runs straight through
    # in one shot.  If we need resume for K2.6 we'll need either a
    # bigger PVC or a checkpoint format that drops the activations
    # and only keeps the per-layer quantizer state.
    method: max
    layerwise: true
    # Force calibration to route every token to ALL 384 experts (top_k =
    # num_experts) so each expert sees a representative subset, then keep
    # per-expert calibration statistics.  CRITICAL for K2.6 quality.
    #
    # Without this knob, modelopt's HF MoE plugin runs
    # ``layer_sync_moe_local_experts_amax`` after calibration which calls
    # ``sync_moe_expert_amax(self.experts)`` -- "Takes the element-wise
    # max of each input_quantizer amax across all experts and writes it
    # back, so every expert shares the same input amax."  At trillion-
    # parameter MoE scale (K2.6 = 1.04T params, 384 routed experts,
    # top_k=8) this broadcast destroys per-expert specialization: every
    # expert in a layer gets the same input_scale (e.g. layer 30 gate/up
    # = 1.002720e-04 across experts.{0..383}), the FP4 input quantization
    # uses one shared scale for activations that are routed-by-expert,
    # and vLLM's NVFP4 MoE kernel produces literal repetitive garbage
    # ("foss foss foss...") at inference -- gsm8k=0%, mmlu=27%, all
    # tasks at random chance regardless of recipe coverage.
    #
    # Setting this to 1.0 makes ``layer_sync_moe_local_experts_amax``
    # short-circuit (see ``_QuantSparseSequentialMoe.layer_sync_moe_local_experts_amax``
    # in modelopt/torch/quantization/plugins/huggingface.py:599 -- "if
    # self._moe_calib_experts_ratio is not None: return"), so each
    # expert's input_quantizer keeps the amax it computed from its own
    # routed token subset.  Compare nvidia/Kimi-K2.5-NVFP4 which has
    # per-expert input_scale variation 4.77e-4 / 5.00e-4 / 5.06e-4 for
    # experts 0/1/10 -- exactly this shape.
    #
    # Cost: calibration forward becomes top_k=384 (vs deployment's
    # top_k=8), so each expert sees 48× more tokens during the cal pass.
    # Wall-clock ~50% slower than the broken-broadcast path; quality
    # recovery is the entire point of this run.  ``1.0`` (full coverage)
    # rather than e.g. ``0.5`` because we want EVERY expert calibrated
    # for K2.6, not just the most-routed ones; trillion-parameter MoE
    # has long-tail experts that matter.
    moe_calib_experts_ratio: 1.0
  quant_cfg:
    # 1) Disable everything by default.  Selectors below opt-in.
    - quantizer_name: '*'
      enable: false

    # 2) NVFP4 W4A4 on routed expert weights (DeepseekV3-style path).
    - quantizer_name: '*mlp.experts.*weight_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1
    - quantizer_name: '*mlp.experts.*input_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1

    # 3) FP8 KV cache (matches NVIDIA's published Kimi-K2.5-NVFP4).
    - quantizer_name: '*[kv]_bmm_quantizer'
      enable: true
      cfg:
        num_bits: e4m3

    # 4) Explicit skips for precision-sensitive paths.
    #    Shared expert: always-active, quant noise compounds.
    - quantizer_name: '*mlp.shared_experts.*'
      enable: false
    - quantizer_name: '*mlp.shared_expert_gate*'
      enable: false
    #    MoE router / gate: routing decisions must stay precise.
    - quantizer_name: '*mlp.gate*'
      enable: false
    - quantizer_name: '*router*'
      enable: false
    #    MLA: q_lora / kv_lora down-up projections.  Up-proj recovers full
    #    QKV from a low-rank latent; quant errors compound across heads.
    - quantizer_name: '*q_a_proj*'
      enable: false
    - quantizer_name: '*q_b_proj*'
      enable: false
    - quantizer_name: '*kv_a_proj_with_mqa*'
      enable: false
    - quantizer_name: '*kv_b_proj*'
      enable: false
    #    MoonViT vision tower -- entire path stays BF16.
    - quantizer_name: '*vision*'
      enable: false
    - quantizer_name: '*vit*'
      enable: false
    - quantizer_name: '*moon_vit*'
      enable: false
    #    Embedding / output head.
    - quantizer_name: '*lm_head*'
      enable: false
    - quantizer_name: '*output_layer*'
      enable: false
    - quantizer_name: 'output.*'
      enable: false

    # Note: norms / nonlinearities are NOT explicitly listed here.
    # ``parent_class: 'nn.RMSNorm'`` would be the natural selector but
    # modelopt's set_quantizer_by_cfg validates that any parent_class
    # string resolves in QuantModuleRegistry (even for ``enable: false``).
    # nn.RMSNorm has no registered quantized equivalent -> ValueError at
    # apply_mode (raised on K2.6's first attempt).  The default
    # ``quantizer_name: '*' enable: false`` at the top of this list
    # already disables every quantizer; the explicit opt-ins above
    # (``*mlp.experts.*weight_quantizer`` etc.) don't match norm/silu
    # modules, so they stay disabled without needing a parent_class
    # selector.
