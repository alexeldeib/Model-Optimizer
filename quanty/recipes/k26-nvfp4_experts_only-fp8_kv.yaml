# K2.6 NVFP4 recipe aligned with the experts-only K2.6 INT4 source layout.
#
# The mounted K2.6 INT4 source used by the dequant verifier contains packed
# weights only under language_model.*.mlp.experts.*.  lm_head, vision,
# projector, dense layer-0 MLP, shared experts, routers, and gates are plain
# tensors.  This recipe must therefore stay on the upstream
# nvfp4_experts_only-fp8_kv selector shape, with only K2.6 calibration
# coverage controls added.
metadata:
  recipe_type: ptq
  description: >
    Kimi K2.6 NVFP4 routed-expert-only W4A4 + FP8 KV cache;
    self-attention, lm_head, projector, vision, layer-0 dense MLP,
    shared experts, router/gate, and embeddings remain native.

quantize:
  algorithm:
    method: max
    layerwise: true
    # K2.6 natural top_k=8 routing collapses to a tiny expert subset in
    # deeper layers: with 2048 cnn_dailymail samples, only 2004/23040 routed
    # expert slots were touched.  Force full expert coverage during the
    # calibration-only pass, then run the normal top_k path for model outputs.
    # Setting this also disables sync_moe_expert_amax(), avoiding ModelOpt's
    # default post-calibration rewrite of every expert input amax.
    moe_calib_experts_ratio: 1.0
  quant_cfg:
    - quantizer_name: '*'
      enable: false

    # Routed expert coverage only.  Do not broaden this to *mlp*: that also
    # catches plain vision/projector/layer-0/shared-expert modules in K2.6.
    - quantizer_name: '*mlp.experts*weight_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1
    - quantizer_name: '*mlp.experts*input_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1

    # Keep the generic sparse-MoE selectors from the upstream recipe so
    # the file remains usable for the Qwen/Mixtral-style smoke path.
    - quantizer_name: '*block_sparse_moe*weight_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1
    - quantizer_name: '*block_sparse_moe*input_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1

    # Explicit exclusions. The first disable-all entry above already keeps
    # unmatched modules native; these entries make the K2.6 expert-only intent
    # visible in exported quantization metadata.
    - quantizer_name: '*self_attn*'
      enable: false
    - quantizer_name: '*vision*'
      enable: false
    - quantizer_name: '*vision_tower*'
      enable: false
    - quantizer_name: '*vit*'
      enable: false
    - quantizer_name: '*moon_vit*'
      enable: false
    - quantizer_name: '*block_sparse_moe.gate*'
      enable: false
    - quantizer_name: '*linear_attn.conv1d*'
      enable: false
    - quantizer_name: '*lm_head*'
      enable: false
    - quantizer_name: '*mixer.conv1d*'
      enable: false
    - quantizer_name: '*mlp.gate*'
      enable: false
    - quantizer_name: '*mlp.gate.*'
      enable: false
    - quantizer_name: '*mlp.shared_experts*'
      enable: false
    - quantizer_name: '*mlp.shared_expert_gate.*'
      enable: false
    - quantizer_name: '*output_layer*'
      enable: false
    - quantizer_name: '*proj_out.*'
      enable: false
    - quantizer_name: '*router*'
      enable: false
    - quantizer_name: 'output.*'
      enable: false
    - parent_class: 'nn.BatchNorm1d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.BatchNorm2d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.BatchNorm3d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.LeakyReLU'
      quantizer_name: '*'
      enable: false

    # Keep the recipe self-contained for FP8 KV cache, matching the
    # upstream nvfp4_experts_only-fp8_kv recipe. This must remain after
    # the broad *self_attn* exclusion above, otherwise the attention
    # exclusion disables k_bmm_quantizer/v_bmm_quantizer again.
    - quantizer_name: '*[kv]_bmm_quantizer'
      enable: true
      cfg:
        num_bits: e4m3
