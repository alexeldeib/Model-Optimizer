metadata:
  recipe_type: speculative_dflash
  description: DFlash recipe with block_size=8, 512 anchors, logit distillation.
dflash:
  dflash_block_size: 8
  dflash_num_anchors: 512
  dflash_use_torch_compile: false
  dflash_self_logit_distillation: true
  dflash_loss_decay_factor: 4.0
  # dflash_mask_token_id: auto-detected from tokenizer.mask_token_id at runtime
  dflash_architecture_config:
    num_hidden_layers: 5
